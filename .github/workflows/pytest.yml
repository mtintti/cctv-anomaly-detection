name: Pytest
on:
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
    Pytest:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - name: setting up python
          uses: actions/setup-python@v7
          with:
            python-version: "3.11"
        - name: Install dependencies for project backend
          working-directory: ./backend
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

        - name: env file creation from github
          run: | 
            touch .env
            echo "DB_HOST=${{secrets.DB_HOST }}" >> .env
            echo "DB_NAME=${{secrets.DB_NAME }}" >> .env
            echo "DB_PASS=${{secrets.DB_PASS }}" >> .env
            echo "DB_PORT=${{secrets.DB_PORT }}" >> .env
            echo "DB_USER=${{secrets.DB_USER }}" >> .env
            echo "DIGITRAFFIC_BASE=${{secrets.DIGITRAFFIC_BASE }}" >> .env
            echo "REDISHOST=${{secrets.REDISHOST }}" >> .env
            echo "REDISPASSWORD=${{secrets.REDISPASSWORD }}" >> .env
            echo "REDISPORT=${{secrets.REDISPORT }}" >> .env
            echo "REDISUSERNAME=${{secrets.REDISUSERNAME }}" >> .env
            echo "DESKTOP=${{secrets.DESKTOP }}" >> .env
            echo "DESKTOP_ANN=${{secrets.DESKTOP_ANN }}" >> .env
            echo "OUTERFILE=${{secrets.OUTERFILE }}" >> .env
            echo "SEGANN=${{secrets.SEGANN }}" >> .env

        - name: Testing with made pytests
          working-directory: ./backend
          run: |
            python -m pytest
